name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Benchmark HNSW search
        run: go test ./index -run '^$' -bench HNSWSearch -benchtime 2000x
      - name: Recall sweep
        run: go run ./cmd/vecbench -n 5000 -queries 100

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vecstore .
      - name: Smoke test the image
        run: |
          docker run -d --name vs -p 8080:8080 vecstore
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs -XPOST localhost:8080/collections -d '{"name":"ci","dim":2}'
          curl -fs -XPUT localhost:8080/collections/ci/vectors -d '{"vectors":[{"id":"a","values":[1,0]}]}'
          curl -fs -XPOST localhost:8080/collections/ci/search -d '{"vector":[1,0],"k":1}' | grep '"id":"a"'

  python-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start server
        run: |
          go build -o vecstore ./cmd/vecstore
          ./vecstore -addr 127.0.0.1:8080 -api-keys ci-key &
          sleep 1
      - name: Client tests
        working-directory: clients/python
        env:
          VECSTORE_URL: http://127.0.0.1:8080
          VECSTORE_API_KEY: ci-key
        run: python -m unittest -v
